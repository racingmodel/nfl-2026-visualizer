name: Exact manual frontend correction (one-time approval)
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Exact approved correction release
        required: true
        type: string
      review_request_sha256:
        description: Exact externally pinned correction request
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  review:
    if: vars.RESEARCH_AUTOMATION_APPROVED == 'false' && vars.RESEARCH_PUBLISH_ENABLED == 'false' && vars.INITIAL_RESEARCH_RELEASE_ENABLED == 'false' && github.actor == 'racingmodel' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Verify exact owner-approved manual correction
        env:
          REQUESTED_RELEASE: ${{ inputs.release_id }}
          REQUESTED_SHA: ${{ inputs.review_request_sha256 }}
          CORRECTION_CONTROL_SHA256: 421545cc8488fd940cd9704539f306f253b99af0f8f0a5419972e3f28844d20a
          CORRECTION_APPROVAL_SHA256: e1ac8217bcd39e53f6a997eb874cd72625feb23e3354d8b8bf01610a6f52c1e6
          RESEARCH_AUTOMATION_APPROVED: ${{ vars.RESEARCH_AUTOMATION_APPROVED }}
          RESEARCH_PUBLISH_ENABLED: ${{ vars.RESEARCH_PUBLISH_ENABLED }}
          INITIAL_RESEARCH_RELEASE_ENABLED: ${{ vars.INITIAL_RESEARCH_RELEASE_ENABLED }}
        run: python scripts/manual_frontend_correction.py verify --out correction_gate.json
      - name: Upload exact whole-site candidate including hidden archive markers
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: correction_release/site
          include-hidden-files: true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: correction-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: correction_gate.json
          retention-days: 90
  publish:
    needs: review
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact manually approved artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Verify every served asset against approved manifest
        run: python scripts/manual_frontend_correction.py live --out correction_live_verification.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: correction-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: correction_live_verification.json
          retention-days: 90
