# Exact Week 10 static package. Deployment requires a fresh owner comment after merge.
name: Exact manual frontend correction (one-time approval)
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Exact approved Week 10 release identity
        required: true
        type: string
      review_request_sha256:
        description: SHA-256 of the exact reviewed request
        required: true
        type: string
      installation_head:
        description: Reviewed main commit
        required: true
        type: string
      approval_comment_id:
        description: Fresh owner approval comment on the exact merged PR
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CONTROL_SHA256: "541ecce54e6f6a61d69fa7af36bbc1e5bd3511afc424c9a524f4bd89f38b7fd7"
  APPROVAL_COMMENT_ID: "${{ inputs.approval_comment_id }}"
  REQUESTED_RELEASE: ${{ inputs.release_id }}
  REQUESTED_SHA: ${{ inputs.review_request_sha256 }}
  INSTALLATION_HEAD: ${{ inputs.installation_head }}
  RESEARCH_AUTOMATION_APPROVED: ${{ vars.RESEARCH_AUTOMATION_APPROVED }}
  RESEARCH_PUBLISH_ENABLED: ${{ vars.RESEARCH_PUBLISH_ENABLED }}
  INITIAL_RESEARCH_RELEASE_ENABLED: ${{ vars.INITIAL_RESEARCH_RELEASE_ENABLED }}
  RESEARCH_MONITOR_ENABLED: ${{ vars.RESEARCH_MONITOR_ENABLED }}

jobs:
  review:
    if: github.actor == 'racingmodel' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Verify new owner approval, frozen assets and fixture clocks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/verify_week10_publication.py review --out week10_review.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: week10_release/site
          include-hidden-files: true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: week10-review-${{ github.run_id }}
          path: week10_review.json

  publish:
    needs: review
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      pages: write
      checks: read
      deployments: read
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Recheck authority and fresh schedule immediately before deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/verify_week10_publication.py pre-deploy --out week10_pre_deploy.json
      - name: Deploy the reviewed Week 10 Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
      - name: Verify the public assets
        run: python -B scripts/verify_week10_publication.py live --out week10_live.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: week10-deployment-verification-${{ github.run_id }}
          path: |
            week10_pre_deploy.json
            week10_live.json
