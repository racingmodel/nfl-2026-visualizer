name: Initial exact Week 8 research release (separate approval)
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Exact independently reviewed release ID
        type: string
        required: true
      review_request_sha256:
        description: Exact initial-only request SHA256 approved by the human
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  review:
    if: vars.INITIAL_RESEARCH_RELEASE_ENABLED == 'true' && vars.RESEARCH_INITIAL_PUBLICATION_VERIFIED != 'true' && vars.RESEARCH_AUTOMATION_APPROVED != 'true' && vars.RESEARCH_PUBLISH_ENABLED != 'true' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    environment: research-initial-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Require exact initial-only grant and immutable artifact
        env:
          REQUESTED_RELEASE: ${{ inputs.release_id }}
          REQUESTED_SHA: ${{ inputs.review_request_sha256 }}
          INITIAL_RESEARCH_REQUEST_SHA256: ${{ vars.INITIAL_RESEARCH_REQUEST_SHA256 }}
          RESEARCH_DEPLOYMENT_CONTROL_SHA256: ${{ vars.RESEARCH_DEPLOYMENT_CONTROL_SHA256 }}
          RESEARCH_APPROVED_POLICY_SHA256: ${{ vars.RESEARCH_APPROVED_POLICY_SHA256 }}
          RESEARCH_INITIAL_PUBLICATION_VERIFIED: ${{ vars.RESEARCH_INITIAL_PUBLICATION_VERIFIED }}
          RESEARCH_POLICY_HMAC_KEY: ${{ secrets.INITIAL_RESEARCH_HMAC_KEY }}
        run: |
          python -c "import os; from pathlib import Path; from scripts.weekly_publication import load; r=load(Path('config/research_initial_request.json')); assert os.environ['REQUESTED_RELEASE']==r['release_id']; assert os.environ['REQUESTED_SHA']==os.environ['INITIAL_RESEARCH_REQUEST_SHA256']"
          python scripts/weekly_publication.py initial-verify --site initial_release/site --manifest initial_release/deployment_manifest.json --request config/research_initial_request.json --policy config/weekly_research_publication_policy.json --approval config/research_initial_approval.json --out initial_gate.json
      - name: Upload only the exact reviewed whole site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: initial_release/site
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: initial-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: initial_gate.json
          retention-days: 30
  publish:
    needs: review
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish exact initially approved artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Verify all actual served asset hashes; never enable automation
        run: python scripts/weekly_publication.py live-verify --site initial_release/site --manifest initial_release/deployment_manifest.json --request config/research_initial_request.json --policy config/weekly_research_publication_policy.json --out initial_live_verification.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: initial-live-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: initial_live_verification.json
          retention-days: 90
